name: アクセストークン更新

on:
  schedule:
    # 毎週月曜 3:40（日本時間）。60日の期限が来る前に更新し続ける
    - cron: "40 18 * * 0"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 更新
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python scripts/refresh_token.py "$RUNNER_TEMP/new_token"
      - name: Secrets を新しいトークンに入れ替える
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_PAT が未設定のため、Secrets は入れ替えていません（手順書の「トークン更新」を参照）"
            exit 0
          fi
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/new_token"
          rm -f "$RUNNER_TEMP/new_token"
          echo "IG_ACCESS_TOKEN を更新しました"
