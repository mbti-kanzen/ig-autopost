name: Instagram自動投稿

on:
  schedule:
    # 15分ごとに起動（UTC）。予約時刻の25分前〜3時間後の投稿を1本処理する
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto=通常 / dry-run=次の1本を公開せずに確認 / check=アカウント確認 / now=指定IDを今すぐ公開"
        required: true
        default: dry-run
        type: choice
        options: [auto, dry-run, check, now]
      id:
        description: "mode=now のときの投稿ID（queue.csv の id）"
        required: false

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 投稿
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          case "$MODE" in
            auto)    python scripts/post_due.py ;;
            dry-run) python scripts/post_due.py --dry-run ;;
            check)   python scripts/post_due.py --check ;;
            now)     python scripts/post_due.py --id "${{ github.event.inputs.id }}" --now ;;
          esac
      - name: 記録を保存
        if: always()
        run: |
          git config user.name "ig-autopost"
          git config user.email "ig-autopost@users.noreply.github.com"
          git add state/posted.json
          if ! git diff --cached --quiet; then
            git commit -m "投稿の記録を更新"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
